name: Playback Native Preflight

on:
  push:
    branches: ['codex/playback-unification']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/playback-native.yml'
      - 'apps/desktop/src/main/player/native/**'
      - 'scripts/playback-native-build.mjs'
      - 'scripts/build-playback-native.mjs'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  native:
    name: Native contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install development libraries
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install mpv
            echo "JAVDEX_MPV_PREFIX=$(brew --prefix mpv)" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y libmpv-dev libegl-dev libgbm-dev libdrm-dev libvulkan-dev
            echo "JAVDEX_MPV_PREFIX=/usr" >> "$GITHUB_ENV"
          fi
      - name: Prepare matching Electron headers
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module'
          import path from 'node:path'
          import {spawnSync} from 'node:child_process'
          import fs from 'node:fs'
          const require = createRequire(import.meta.url)
          const rebuild = createRequire(require.resolve('@electron/rebuild'))
          const nodeGyp = path.dirname(rebuild.resolve('node-gyp/package.json'))
          const version = require('electron/package.json').version
          const cache = path.resolve('out/native-preflight-headers')
          const result = spawnSync(process.execPath, [path.join(nodeGyp, 'bin/node-gyp.js'), 'install', `--target=${version}`, '--dist-url=https://electronjs.org/headers', `--devdir=${cache}`, '--ensure'], {stdio:'inherit'})
          if (result.error) throw result.error
          if (result.status !== 0) process.exit(result.status ?? 1)
          fs.appendFileSync(process.env.GITHUB_ENV, `JAVDEX_ELECTRON_HEADERS=${path.join(cache, version, 'include/node')}\n`)
          JS
      - name: Build and run native contracts
        run: npm run playback:native:build
      - name: Record verification scope
        if: always()
        shell: bash
        run: |
          echo 'Development system libraries; native core and resource transport only. No Canvas, physical GPU, formal runtime or installer acceptance.' >> "$GITHUB_STEP_SUMMARY"
