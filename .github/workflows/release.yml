name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag. Leave empty to use package.json version."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean
      verify_only:
        description: "Build and verify desktop packages only; do not publish releases or server images."
        required: false
        default: false
        type: boolean
      replace_published_090:
        description: "One-time authorized replacement of original 0.9.0; stage all outputs and retain old assets."
        type: boolean
        default: false
      replacement_source_sha:
        description: "Exact checked source SHA required for the controlled 0.9.0 replacement."
        type: string
        required: false
  push:
    branches:
      - "release-*"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # A version can be requested from multiple refs. Serialize all publishing runs.
  group: release-publication
  cancel-in-progress: false

env:
  RELEASE_REPLACE_090: ${{ inputs.replace_published_090 }}
  RELEASE_REPLACEMENT_SOURCE: ${{ inputs.replacement_source_sha }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_VERIFY_ONLY: ${{ inputs.verify_only }}
  RELEASE_PRERELEASE: ${{ inputs.prerelease }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
      imageTag: ${{ steps.meta.outputs.imageTag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release-metadata.test.mjs scripts/release-publication.test.mjs scripts/release-replacement.test.mjs scripts/release-replacement-process.test.mjs
      - id: meta
        run: node scripts/release-metadata.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_VERIFY_ONLY: ${{ inputs.verify_only }}
          GITHUB_TOKEN: ${{ github.token }}

  test:
    needs: metadata
    name: Typecheck and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify playback authorization on Windows
        # Native modules are prepared explicitly for the desktop runtime.
        # Root/workspace installs no longer trigger an Electron rebuild.
        run: npm run setup:desktop && node scripts/run-electron-tests.mjs packages/library/src/catalog/catalogPlay.test.ts

      - name: Run tests
        run: npm test
        env:
          # The complete Windows suite can exceed five minutes on hosted runners.
          JAVDEX_TEST_TIMEOUT_MS: "900000"

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: test
    timeout-minutes: ${{ matrix.platform == 'linux' && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-2022
            arch: x64
          - platform: mac
            os: macos-15-intel
            arch: x64
          - platform: mac
            os: macos-15
            arch: arm64
          - platform: linux
            os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
      JAVDEX_PLAYBACK_RUNTIME_DIR: ${{ github.workspace }}/out/playback-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          # The private helper closures deliver the exact Ubuntu source packages.
          # Enable matching source repositories only on this ephemeral runner.
          sudo sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/javdex-sources.list >/dev/null
          test -s /etc/apt/sources.list.d/javdex-sources.list
          sudo apt-get update
          sudo apt-get install -y rpm build-essential cmake nasm patchelf pkg-config xz-utils python3-venv libx11-dev libxft-dev libxext-dev libxrandr-dev libxss-dev libxpresent-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libpulse-dev libva-dev fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS source build tools
        if: matrix.platform == 'mac'
        run: brew install cmake nasm

      - name: Prepare Windows native compiler
        if: matrix.platform == 'win'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare Windows source build tools
        if: matrix.platform == 'win'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make tar xz diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python

      - name: Install dependencies
        run: npm ci

      - name: Identify playback source/toolchain cache
        if: matrix.platform != 'linux'
        id: playback_fingerprint
        run: npm run playback:runtime:build -- --fingerprint
        env:
          JAVDEX_PLAYBACK_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}

      - name: Cache source-built playback inputs
        if: matrix.platform != 'linux'
        # The exact compiler/SDK/options fingerprint is calculated before restore,
        # so hosted-image updates can save a fresh cache instead of reusing an
        # immutable stale key and rebuilding on every run.
        uses: actions/cache@v4
        with:
          path: |
            out/playback-runtime
            out/playback-runtime-build/sources
          key: playback-source-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.playback_fingerprint.outputs.fingerprint }}

      - name: Build playback runtime from pinned source
        if: matrix.platform != 'linux'
        run: npm run playback:runtime:build
        env:
          JAVDEX_PLAYBACK_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}

      - name: Verify macOS GPU leases and CPU rendering contracts
        if: matrix.platform == 'mac'
        run: node scripts/run-electron-tests.mjs apps/desktop/src/main/player/macSharedTextureNative.test.ts apps/desktop/src/main/player/macSoftwareNative.test.ts
        env:
          JAVDEX_TEST_MAC_PLAYBACK_NATIVE: ${{ github.workspace }}/out/playback-runtime/darwin-${{ matrix.arch }}/playback.node

      - name: Cache verified Linux source downloads
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: |
            out/linux-portable-build/sources
            out/linux-software-build/sources
          key: linux-playback-downloads-${{ hashFiles('build/playback-sources.json') }}

      - name: Build both isolated Linux playback runtimes
        if: matrix.platform == 'linux'
        run: |
          npm run playback:runtime:build -- --linux-portable
          npm run playback:runtime:build -- --linux-software

      - name: Cache pinned Linux ANGLE and corresponding sources
        if: matrix.platform == 'linux'
        id: linux_angle
        uses: actions/cache@v4
        with:
          path: out/linux-angle-runtime
          key: linux-angle-ubuntu22-v1-${{ hashFiles('scripts/build-linux-angle.py', 'build/angle-runtime.json', 'build/angle-args.gn', 'build/angle-electron-patches/**', 'build/patches/angle-x11-vulkan-visual.patch') }}

      - name: Build Electron-matched patched ANGLE
        if: matrix.platform == 'linux' && steps.linux_angle.outputs.cache-hit != 'true'
        run: python3 scripts/build-linux-angle.py "$GITHUB_WORKSPACE/out/linux-angle-build"
        env:
          JAVDEX_ANGLE_JOBS: '2'

      - name: Verify Linux ANGLE cache provenance and source delivery
        if: matrix.platform == 'linux'
        run: node --input-type=module -e "import { verifyLinuxAngleRuntime } from './scripts/linux-angle-runtime.mjs'; verifyLinuxAngleRuntime()"

      - name: Package
        run: npm run setup:desktop && npm run dist -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify packaged playback runtime and corresponding source delivery
        run: npm run packaging:verify-playback-runtime

      - name: Verify packaged Agent runtime
        run: npm run packaging:verify-agent-runtime

      - name: Verify macOS application signatures
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=4 "$app"
            found=1
          done < <(find dist -type d -name '*.app' -prune -print0)
          if [[ $found -eq 0 ]]; then
            echo "No macOS application bundles were produced." >&2
            exit 1
          fi

      - name: Verify playback inside final installers and bind their digests
        run: node scripts/check-playback-installers.mjs dist

      - name: Upload packaged artifacts
        # Keep builder diagnostics and update metadata in CI, not in public release assets.
        uses: actions/upload-artifact@v4
        with:
          name: Javdex-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
            dist/Javdex-Playback-Sources-*.tar.gz
            dist/Javdex-Playback-Sources-*.tar.gz.runtime.json
            dist/Javdex-Playback-Sources-*.tar.gz.installers.json
          if-no-files-found: error

  playback-sources:
    name: Aggregate corresponding playback sources
    needs: [metadata, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: Javdex-*
          path: source-artifacts
          merge-multiple: true
      - name: Aggregate and verify corresponding playback sources
        run: node scripts/aggregate-playback-sources.mjs source-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Playback-Sources-Combined
          path: source-artifacts/playback-sources-combined/*.tar.gz
          if-no-files-found: error

  server:
    name: Server image (${{ matrix.arch }})
    if: ${{ !inputs.verify_only }}
    needs: [metadata, package, playback-sources]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate server update signing before publishing images
        env:
          JAVDEX_SERVER_UPDATE_SIGNING_KEY: ${{ secrets.JAVDEX_SERVER_UPDATE_SIGNING_KEY }}
          JAVDEX_SERVER_UPDATE_KEY_ID: ${{ vars.JAVDEX_SERVER_UPDATE_KEY_ID }}
        run: node scripts/server-update-release.mjs validate
      - run: npm run server:build
        env:
          JAVDEX_SERVER_UPDATE_SIGNING_KEY: ${{ secrets.JAVDEX_SERVER_UPDATE_SIGNING_KEY }}
          JAVDEX_SERVER_UPDATE_KEY_ID: ${{ vars.JAVDEX_SERVER_UPDATE_KEY_ID }}
      - run: npm run server:test
      - run: npm run server:updater:test
      - name: Verify supplementary business groups under Linux root
        run: |
          set -euo pipefail
          setpriv --version
          sudo "$(command -v node)" --require ./scripts/register-test-paths.cjs --import tsx --test apps/server/src/updater/businessProcess.test.ts
      - name: Verify single-container updates before publishing this architecture
        run: npm run server:updater:smoke
      - run: npm run server:smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          docker tag javdex-server:smoke "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          docker push "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"

  server-manifest:
    needs: [metadata, server]
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Reject an existing version before publishing its fixed image tag
        run: node scripts/release-publication.mjs manifest
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish versioned multi-platform image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.imageTag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64" "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    name: Publish GitHub release
    needs: [metadata, package, playback-sources, server-manifest]
    if: ${{ !inputs.verify_only && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-artifacts
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -printf '%f\0' | LC_ALL=C sort -z)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No release packages were found." >&2
            exit 1
          fi
          sha256sum -- "${packages[@]}" > SHA256SUMS.txt
          sha256sum -- "Javdex-Playback-Sources-$VERSION.tar.gz" >> SHA256SUMS.txt

      - name: Prepare release description and versioned deployment links
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          cp ".github/release-notes/$TAG.md" release-body.md
          printf '\n\n### 下载与部署\n\n桌面用户选择对应系统的安装包即可，无需下载源码。`Javdex-Playback-Sources-%s.tar.gz` 为四个平台的总源码包，含摘要去重材料和恢复说明。\n\nDocker 镜像：`%s:%s`（Linux amd64 / arm64）。桌面与服务端须使用相同版本。\n\n[Compose 示例](https://github.com/%s/blob/%s/deploy/docker-compose.example.yml) · [JSON 配置示例](https://github.com/%s/blob/%s/deploy/javdex-server.example.json) · [部署说明](https://github.com/%s/blob/%s/docs/SERVER_MODE.md)。可信升级公钥已内置镜像，不需要下载公钥附件。\n' "$VERSION" "$IMAGE" "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-body.md

      - run: npm run server:updater:build
      - name: Read verified server images for update packaging
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish signed server update artifacts
        env:
          JAVDEX_SERVER_UPDATE_SIGNING_KEY: ${{ secrets.JAVDEX_SERVER_UPDATE_SIGNING_KEY }}
          JAVDEX_SERVER_UPDATE_KEY_ID: ${{ vars.JAVDEX_SERVER_UPDATE_KEY_ID }}
        run: node scripts/server-update-release.mjs publish --directory release-artifacts

      - name: Reject an existing Release or a changed tag before uploading
        run: node scripts/release-publication.mjs release
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish release
        if: ${{ !inputs.replace_published_090 }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Javdex ${{ needs.metadata.outputs.tag }}
          body_path: release-body.md
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.zip
            release-artifacts/Javdex-Playback-Sources-${{ needs.metadata.outputs.version }}.tar.gz
            release-artifacts/SHA256SUMS.txt
            release-artifacts/Javdex-server-*.javdex-update

      - uses: docker/setup-buildx-action@v3
        if: inputs.replace_published_090
      - name: Stage complete replacement and perform conditional recoverable cutover
        if: inputs.replace_published_090
        run: node scripts/release-replacement-publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain replacement receipt including any recovery result
        if: ${{ always() && inputs.replace_published_090 }}
        uses: actions/upload-artifact@v4
        with:
          name: Controlled-090-Replacement-Receipt
          path: replacement-receipt.json
          if-no-files-found: warn
