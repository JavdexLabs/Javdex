name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag. Leave empty to use package.json version."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "release-*"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release-metadata.test.mjs
      - id: meta
        run: node scripts/release-metadata.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}

  test:
    needs: metadata
    name: Typecheck and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Native modules are prepared explicitly for the desktop runtime.
        # Root/workspace installs no longer trigger an Electron rebuild.
        run: npm run setup:desktop && npm test
        env:
          # The complete Windows suite can exceed five minutes on hosted runners.
          JAVDEX_TEST_TIMEOUT_MS: "900000"

  package:
    name: Package ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
          - platform: mac
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run setup:desktop && npm run dist -- --platform ${{ matrix.platform }}

      - name: Verify packaged Agent runtime
        run: npm run packaging:verify-agent-runtime

      - name: Verify macOS application signatures
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=4 "$app"
            found=1
          done < <(find dist -type d -name '*.app' -prune -print0)
          if [[ $found -eq 0 ]]; then
            echo "No macOS application bundles were produced." >&2
            exit 1
          fi

      - name: Upload packaged artifacts
        # Keep builder diagnostics and update metadata in CI, not in public release assets.
        uses: actions/upload-artifact@v4
        with:
          name: Javdex-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error

  server:
    name: Server image (${{ matrix.arch }})
    needs: [metadata, package]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run server:build
      - run: npm run server:smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          docker tag javdex-server:smoke "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          docker push "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"

  server-manifest:
    needs: [metadata, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish versioned multi-platform image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64" "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    name: Publish GitHub release
    needs: [metadata, package, server-manifest]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -printf '%f\0' | LC_ALL=C sort -z)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No release packages were found." >&2
            exit 1
          fi
          sha256sum -- "${packages[@]}" > SHA256SUMS.txt

      - name: Attach server deployment files
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          cp deploy/docker-compose.example.yml deploy/javdex-server.example.json release-artifacts/
          cd release-artifacts
          sha256sum docker-compose.example.yml javdex-server.example.json >> SHA256SUMS.txt
          cd ..
          cp ".github/release-notes/$TAG.md" release-body.md
          printf '\n\n### Docker 服务端\n\n镜像：`%s:%s`（Linux amd64 / arm64）。\n\n下载下方 Compose 和 JSON 配置，部署步骤见 https://github.com/%s/blob/%s/docs/SERVER_MODE.md 。桌面与服务端须使用相同版本。\n' "$IMAGE" "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Javdex ${{ needs.metadata.outputs.tag }}
          body_path: release-body.md
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
            release-artifacts/docker-compose.example.yml
            release-artifacts/javdex-server.example.json
