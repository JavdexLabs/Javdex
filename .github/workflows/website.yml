name: Check documentation site

on:
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - ".github/workflows/website.yml"
  push:
    branches: [dev]
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @javdex/website --include-workspace-root=false
      - run: npm run pages:test
      - run: npm run pages:build:offline
