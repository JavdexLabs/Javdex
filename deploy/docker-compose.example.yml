services:
  javdex:
    image: javdex-server:local
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
    environment:
      JAVDEX_WEB_PASSWORD: "replace-with-a-long-password"
    volumes:
      - javdex-data:/data
      - /absolute/path/to/media:/media:ro
      - ./javdex-server.example.json:/config/server.json:ro
    command: ["start", "--config", "/config/server.json"]

volumes:
  javdex-data:
