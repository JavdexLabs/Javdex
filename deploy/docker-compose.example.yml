services:
  javdex:
    # 新程序卷以镜像初始化；已有 /program 在镜像业务版本更高时自动升级（不会创建资料库备份），不降级。
    image: ghcr.io/javdexlabs/javdex-server:${JAVDEX_VERSION:?Set JAVDEX_VERSION to the base image version, for example 0.9.0}
    restart: unless-stopped
    stop_grace_period: 150s
    security_opt:
      - no-new-privileges:true
    ports:
      - "8096:8096"
    environment:
      JAVDEX_WEB_PASSWORD: "replace-with-a-long-password"
      # 客户端、授权和更新使用 HTTPS；Web 同端口支持 HTTP/HTTPS，共用登录 Cookie。
      # 此处仍须填写 HTTPS 地址；仅向可信局域网或私有网络开放。
      JAVDEX_PUBLIC_URL: "https://192.168.1.10:8096"
      # 业务子进程身份；需同时能访问 /data、图片目录和媒体目录。
      JAVDEX_SERVER_UID: "1000"
      JAVDEX_SERVER_GID: "1000"
      # 含附加组修复的管理器镜像支持；填 NAS 实际授权组，不能只设 group_add。
      # JAVDEX_SERVER_GROUPS: "101,100"
    volumes:
      - javdex-data:/data
      # 必须保留：发行版本、配对凭据、更新日志。
      - javdex-program:/program
      # 媒体库目录必须可读写；宿主机/NAS 权限也需允许容器内 node 用户读写。
      # 添加来源需写入 .javdex-root 标记，不要将媒体卷改为 :ro。
      - /absolute/path/to/media:/media:rw
      - ./javdex-server.example.json:/config/server.json:ro
    command: ["start", "--config", "/config/server.json"]

volumes:
  javdex-data:
  javdex-program:
